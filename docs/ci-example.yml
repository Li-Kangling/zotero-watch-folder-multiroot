name: Test and build
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run source
      - uses: actions/upload-artifact@v4
        with:
          name: multi-root-build
          path: |
            ../zotero-watch-folder-multiroot-*.xpi
            ../zotero-watch-folder-multiroot-*.xpi.sha256
            ../zotero-watch-folder-multiroot-*-source.zip
